name: Scrape BFI IMAX seats

on:
  workflow_dispatch: # manual trigger only while testing the Cloudflare fix

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scrape_to_csv.py
            pyproject.toml
            uv.lock
          sparse-checkout-cone-mode: false

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync

      - name: Install Chrome
        run: uv run playwright install --with-deps chrome || true

      - name: Scrape seats
        env:
          BFI_EMAIL: ${{ secrets.BFI_EMAIL }}
          BFI_PASSWORD: ${{ secrets.BFI_PASSWORD }}
        run: xvfb-run uv run python scrape_to_csv.py

      - name: Report what would be committed (dry run)
        run: |
          echo "Files written to data/:"
          ls -la data/ | head -20
          echo "Total files: $(ls data/ | wc -l)"
